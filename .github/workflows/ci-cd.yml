# CI on every push and pull request; deploys the app to EKS on pushes to main once CI passes.
#
# Deploy prerequisites (one-time):
#   - Terraform in infrastructure/eks has been applied (it creates the OIDC role used below).
#   - Repository variable AWS_DEPLOY_ROLE_ARN = `terraform -chdir=infrastructure/eks output -raw github_deploy_role_arn`
#     (GitHub → Settings → Secrets and variables → Actions → Variables).
# Infrastructure changes are still applied manually with Terraform; this workflow only ships app code.

name: CI/CD

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  AWS_REGION: us-east-2
  EKS_CLUSTER: freshmart-eks
  ECR_REPOSITORY: freshmart-eks-backend

jobs:
  backend:
    name: Backend tests (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: grocery
          POSTGRES_PASSWORD: grocery
          POSTGRES_DB: grocery_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U grocery -d grocery_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://grocery:grocery@localhost:5432/grocery_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Migrations apply cleanly and match the models
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
      - run: pytest -q

  frontend:
    name: Frontend type-check & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  terraform:
    name: Terraform fmt & validate
    runs-on: ubuntu-latest
    env:
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugin-cache
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - run: mkdir -p "$TF_PLUGIN_CACHE_DIR"
      - run: terraform fmt -check -recursive infrastructure
      - name: Validate stacks
        run: |
          for stack in infrastructure/eks infrastructure/ecs; do
            echo "::group::$stack"
            terraform -chdir="$stack" init -backend=false -input=false
            terraform -chdir="$stack" validate
            echo "::endgroup::"
          done

  k8s:
    name: Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/
      - name: Validate (placeholders filled with dummy values)
        run: |
          # shellcheck disable=SC2016  # ${...} below are literal placeholders, not shell variables
          for f in k8s/*.yaml; do
            sed -e 's|\${BACKEND_IMAGE}|example/backend:ci|' \
                -e 's|\${[A-Z_]*_TG_ARN}|arn:aws:elasticloadbalancing:us-east-2:111111111111:targetgroup/x/abc|' "$f"
            echo "---"
          done | kubeconform -strict -summary -kubernetes-version 1.36.0 \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' -

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t freshmart-backend:ci backend
      - run: docker build -t freshmart-frontend:ci frontend

  deploy:
    name: Deploy to EKS
    needs: [backend, frontend, terraform, k8s, docker]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC token for AWS
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Worker nodes are x86 (m7i-flex, the free-plan limit), matching the runner, so no emulation.
      - name: Build and push backend image
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
        run: |
          docker build --platform linux/amd64 -t "$IMAGE" backend
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Configure kubectl
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER" --region "$AWS_REGION"

      - name: Run database migrations
        run: |
          kubectl -n freshmart delete job migrate --ignore-not-found --wait
          sed "s|\${BACKEND_IMAGE}|$IMAGE|g" k8s/migrate-job.yaml | kubectl apply -f -
          for _ in $(seq 1 60); do
            succeeded=$(kubectl -n freshmart get job migrate -o jsonpath='{.status.succeeded}')
            failed=$(kubectl -n freshmart get job migrate -o jsonpath='{.status.failed}')
            [[ "$succeeded" == "1" ]] && break
            if [[ "${failed:-0}" -gt 2 ]]; then break; fi
            sleep 5
          done
          kubectl -n freshmart logs job/migrate --tail=50 || true
          [[ "$succeeded" == "1" ]] || { echo "::error::Migration job did not succeed"; exit 1; }

      - name: Roll out backend
        run: |
          sed "s|\${BACKEND_IMAGE}|$IMAGE|g" k8s/backend.yaml | kubectl apply -f -
          kubectl -n freshmart rollout status deployment/backend --timeout=5m

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build

      - name: Publish frontend
        run: |
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          BUCKET="freshmart-eks-frontend-${ACCOUNT}-${AWS_REGION}"
          DIST_ID=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?Comment=='freshmart-eks storefront'].Id | [0]" --output text)
          aws s3 sync frontend/dist "s3://$BUCKET" --delete --exclude index.html \
            --cache-control "public,max-age=31536000,immutable"
          aws s3 cp frontend/dist/index.html "s3://$BUCKET/index.html" --cache-control "no-cache"
          aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/*" --query 'Invalidation.Id' --output text

      - name: Smoke test
        run: |
          DOMAIN=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?Comment=='freshmart-eks storefront'].DomainName | [0]" --output text)
          curl -fsS "https://$DOMAIN/api/health"
          echo "Deployed ${GITHUB_SHA::7} → https://$DOMAIN" >> "$GITHUB_STEP_SUMMARY"
