# FastAPI backend. ${BACKEND_IMAGE} is substituted by infrastructure/eks/scripts/deploy.sh.
# Secrets (DATABASE_URL, JWT_SECRET, ADMIN_EMAIL, ADMIN_PASSWORD) come from the freshmart-secrets
# Secret, which deploy.sh creates from AWS Secrets Manager.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: freshmart
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: backend
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: backend
      containers:
        - name: backend
          image: ${BACKEND_IMAGE}
          command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", "*"]
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - secretRef:
                name: freshmart-secrets
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: freshmart
  labels:
    app: backend
spec:
  selector:
    app: backend
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: backend
  namespace: freshmart
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: backend
